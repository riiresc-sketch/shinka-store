<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Shinka Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="navbar sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold glow-text">Shinka<span>Store</span></h1>
            <nav class="flex gap-2">
                <a href="index.html" class="btn nav-active">Store</a>
                <a href="docs.html" class="btn btn-ghost">Docs</a>
                <a href="login.html" class="btn btn-ghost">Admin</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        
        <!-- PRODUK UNGGULAN: AM PREMIUM -->
        <div class="card mb-8 border-[var(--primary)]" style="box-shadow: 0 0 30px var(--glow);">
            <div class="flex items-center gap-2 mb-4">
                <span class="px-3 py-1 text-xs font-bold rounded-full bg-gradient-to-r from-purple-600 to-pink-500">UNGGULAN</span>
                <h2 class="text-2xl font-bold glow-text">Alight Motion Premium</h2>
            </div>
            <p class="text-[var(--text-muted)] mb-4">Aktif otomatis 5-15 menit. Full fitur no watermark.</p>
            
            <input id="amEmail" type="email" placeholder="Masukkan email AM kamu" class="mb-4">
            <div class="grid sm:grid-cols-2 gap-4">
                <div class="card !p-4">
                    <p class="font-bold text-[var(--primary)]">FAST MODE</p>
                    <p class="text-3xl font-bold">Rp2.000</p>
                    <button onclick="buatInvoiceAM('fast', 2000)" class="btn btn-primary w-full mt-2">Beli Sekarang</button>
                </div>
                <div class="card !p-4">
                    <p class="font-bold text-pink-400">SLOW MODE</p>
                    <p class="text-3xl font-bold">Rp1.000</p>
                    <button onclick="buatInvoiceAM('slow', 1000)" class="btn btn-ghost w-full mt-2">Beli Sekarang</button>
                </div>
            </div>
            <div id="am-qris" class="mt-4"></div>
        </div>

        <!-- PRODUK LAINNYA -->
        <h2 class="text-3xl font-bold mb-6 glow-text">Product Catalog</h2>
        <input id="searchInput" placeholder="Cari produk..." oninput="handleSearch()">
        <div id="produk-list" class="grid md:grid-cols-2 gap-6 mt-6"></div>
    </main>

<script src="assets/app.js"></script>
<script>
let allProductsData = []
let checkInterval

async function buatInvoiceAM(mode, harga) {
    let email = document.getElementById('amEmail').value
    if(!email) return alert('Isi email dulu')
    document.getElementById('am-qris').innerHTML = `<div class="card text-center"><p>Loading QRIS...</p></div>`
    
    let json = await apiFetch('/am/create', {
        method: 'POST', 
        headers: {'Content-Type':'application/json'}, 
        body: JSON.stringify({email, mode, harga, type:'am'})
    })
    
    document.getElementById('am-qris').innerHTML = `<div class="card text-center"><img src="${json.qris_image}" class="w-64 mx-auto rounded-lg"><p id="status-bayar" class="mt-2">Menunggu Pembayaran...</p></div>`
    
    clearInterval(checkInterval)
    checkInterval = setInterval(async () => {
        let cek = await apiFetch(`/am/check/${json.invoice_id}`)
        if(cek.db_status === 'done') {
            document.getElementById('status-bayar').innerText = 'PAID ✅ Cek email'
            clearInterval(checkInterval)
        }
    }, 5000)
}

async function loadProduk() {
    let json = await apiFetch('/produk')
    allProductsData = json.data || []
    renderProduk(allProductsData)
}
function renderProduk(data) {
    let html = data.map(p => `
        <div class="card">
            <h3 class="font-bold text-xl">${p.name}</h3>
            <p class="text-sm text-[var(--text-muted)] mb-2">${p.category}</p>
            ${p.variants.map(v => `<div class="flex justify-between mt-2"><span>${v.name}</span><span class="font-bold">Rp${v.price.toLocaleString()}</span></div>`).join('')}
        </div>
    `).join('')
    document.getElementById('produk-list').innerHTML = html || '<p class="text-[var(--text-muted)]">Produk kosong</p>'
}
function handleSearch() {
    let q = document.getElementById('searchInput').value.toLowerCase()
    let filtered = allProductsData.filter(p => p.name.toLowerCase().includes(q))
    renderProduk(filtered)
}
loadProduk()
</script>
</body>
</html>
